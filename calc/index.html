<style>
  /* ★199차 — 한 화면 고정 레이아웃.
     계산기는 "보면서 만지는" 화면이라 스크롤이 곧 불편이다(사용자 지적).
     그래서 페이지 자체는 스크롤하지 않고(html,body overflow:hidden),
     [파티 레일 | 두 포켓몬 | 결과] 세 열이 뷰포트 높이를 나눠 갖는다. 넘치면 **그 열만** 스크롤한다. */
  :root {
    --bg: #1b1d22; --panel: #24272e; --panel2: #2b2f37; --line: #3a3f49;
    --txt: #e8eaed; --muted: #9aa0a8; --accent: #3a6fc8; --accent2: #5b8de0;
    --ok: #6fd08a; --warn: #e0b15b; --bad: #e07a7a; --mega: #7a5bd0;
    --rail: 196px; --out: 344px; --maxw: 1460px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg); color: var(--txt);
    font-family: "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
    line-height: 1.5; font-size: 14px; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  a { color: var(--accent2); text-decoration: none; }
  a:hover { text-decoration: underline; }

  input, select {
    width: 100%; background: var(--panel2); color: var(--txt);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 13px;
    font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  input[type="checkbox"] { width: auto; accent-color: var(--accent); }

  header { flex: none; }

  /* 부팅 */
  .bootbar {
    margin: 40px auto; max-width: 520px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px 18px; text-align: center; color: var(--muted); font-size: 13px;
  }
  .bootbar .spin {
    display: inline-block; width: 13px; height: 13px; margin-right: 8px; vertical-align: -2px;
    border: 2px solid var(--line); border-top-color: var(--accent2); border-radius: 50%;
    animation: sp .7s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
  .bootbar.bad { color: var(--bad); border-color: var(--bad); }

  /* ── 3열 판 ─────────────────────────────────────────────── */
  .calcgrid {
    flex: 1 1 auto; min-height: 0;
    display: grid; grid-template-columns: var(--rail) minmax(0, 1fr) var(--out);
    gap: 10px; padding: 10px 14px 12px;
    /* ★넓은 화면에서 열을 늘리지 않는다 — 계산기는 폭이 넓어져도 읽기 쉬워지지 않고 눈만 멀리 옮긴다.
       필요한 폭만 쓰고 가운데로 모은다(사용자 지시: 스마트누오처럼 슬림하게). */
    max-width: var(--maxw); margin: 0 auto; width: 100%;
    align-items: start;   /* 내용이 적으면 패널이 그만큼만 — 빈 상자를 화면 끝까지 늘리지 않는다 */
  }
  .calcgrid > * { min-height: 0; max-height: 100%; }
  .rail, .out { overflow: auto; }
  .board { display: flex; flex-direction: column; gap: 8px; min-height: 0; max-height: 100%; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; }

  /* 레일 = 모드 + 내 파티 세로 목록 */
  .rail { display: flex; flex-direction: column; gap: 8px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg.vert { flex-direction: column; }
  .seg button {
    background: var(--panel2); color: var(--muted); border: none;
    padding: 7px 11px; font-size: 13px; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 700; }
  .seg.vert button + button { border-top: 1px solid var(--line); }
  .seg:not(.vert) button + button { border-left: 1px solid var(--line); }
  .seg.small button { padding: 5px 10px; font-size: 12px; }

  .rail .card { padding: 9px; }
  .rail h3 { font-size: 12px; color: var(--muted); margin: 0 0 7px; font-weight: 700; }
  .rail select { font-size: 12px; padding: 5px 7px; margin-bottom: 8px; }
  .mons { display: flex; flex-direction: column; gap: 5px; }
  .mon {
    display: flex; align-items: center; gap: 7px; width: 100%; padding: 4px 6px; border-radius: 8px;
    background: var(--panel2); border: 1px solid var(--line); color: var(--muted);
    cursor: pointer; font-family: inherit; text-align: left;
  }
  .mon.on { border-color: var(--accent); background: rgba(58,111,200,.2); color: var(--txt); }
  .mon img { width: 38px; height: 38px; flex: none; object-fit: contain; }
  .mon .nm { font-size: 12.5px; line-height: 1.3; word-break: keep-all; }
  .railmsg { font-size: 12px; color: var(--muted); line-height: 1.65; }

  /* 판 상황 */
  .field-bar {
    flex: none; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 7px 12px;
  }
  .field-bar .fb { display: flex; align-items: center; gap: 7px; font-size: 13px; }
  .field-bar label { color: var(--muted); }
  .field-bar select { width: auto; min-width: 98px; padding: 4px 7px; font-size: 13px; }

  /* 두 포켓몬 */
  .duel { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .side {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 13px; overflow: auto; min-height: 0;
  }
  .side.my  { border-top: 3px solid var(--accent); }
  .side.opp { border-top: 3px solid var(--bad); }
  /* 공격/수비 표식 = 타입 칩 줄에 함께 놓는다(제목 줄 한 줄이 곧 스크롤이라 없앴다) */
  .tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
  .tag.my  { background: rgba(58,111,200,.25); color: var(--accent2); }
  .tag.opp { background: rgba(224,122,122,.22); color: var(--bad); }

  .row { margin-bottom: 8px; position: relative; }
  .row > label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 3px; }
  .row.inline { display: flex; gap: 6px; }
  .row.inline > div { flex: 1; min-width: 0; }

  .headline { display: flex; gap: 9px; align-items: flex-start; }
  .headline .sprite {
    width: 62px; height: 62px; flex: none; border-radius: 8px; background: var(--panel2);
    border: 1px solid var(--line); object-fit: contain; image-rendering: -webkit-optimize-contrast;
  }
  .headline .hcol { flex: 1; min-width: 0; }

  .chips { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .tchip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; color: #fff; }
  .achip {
    font-size: 11px; padding: 2px 9px; border-radius: 20px; cursor: pointer;
    background: var(--panel2); border: 1px solid var(--line); color: var(--muted); font-family: inherit;
  }
  .achip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .achip.mega { border-color: var(--mega); color: #b9a4ef; }
  .achip.mega.on { background: var(--mega); border-color: var(--mega); color: #fff; }

  .desc { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
  .desc:empty { display: none; }
  /* 설명은 한 줄만 — 두 줄이 되면 그만큼 아래가 밀린다(전문은 hover 툴팁) */
  .desc.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .statline { font-size: 12px; color: var(--muted); margin: 3px 0 7px; }
  .picked { font-size: 17px; font-weight: 700; padding: 2px 0 0; }
  .picked .none { font-size: 13px; font-weight: 400; color: var(--muted); }

  /* 체력바 */
  .hpwrap { margin-top: 4px; }
  .hpbar { height: 12px; border-radius: 7px; background: var(--panel2); border: 1px solid var(--line);
           overflow: hidden; cursor: pointer; position: relative; }
  .hpbar > i { display: block; height: 100%; background: var(--ok); transition: width .06s linear; }
  .hpbar.mid > i { background: var(--warn); }
  .hpbar.low > i { background: var(--bad); }
  .hprow { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 11.5px; color: var(--muted); }
  .hprow input { width: 58px; padding: 3px 6px; font-size: 12px; text-align: right; }

  /* 자동완성 */
  .ac { position: absolute; z-index: 40; left: 0; right: 0; top: 100%; margin-top: 2px;
        background: var(--panel2); border: 1px solid var(--accent); border-radius: 8px;
        max-height: 200px; overflow: auto; box-shadow: 0 8px 22px rgba(0,0,0,.45); }
  .ac div { padding: 6px 10px; font-size: 13px; cursor: pointer; }
  .ac div:hover, .ac div.sel { background: var(--accent); color: #fff; }
  .ac .ac-grp {
    padding: 4px 9px 2px; font-size: 10px; color: var(--muted); cursor: default;
    border-top: 1px solid var(--line); background: transparent;
  }
  .ac .ac-grp:hover { background: transparent; color: var(--muted); }
  .ac .ac-grp:first-child { border-top: none; }

  .combo { position: relative; }
  .combo input { padding-right: 24px; }
  .combo-caret {
    position: absolute; right: 1px; top: 1px; bottom: 1px; width: 22px;
    background: transparent; border: none; color: var(--muted); cursor: pointer;
    font-size: 10px; padding: 0; font-family: inherit;
  }
  .combo-caret:hover { color: var(--txt); }

  /* 기술 4칸 = 2×2 (세로 4줄이면 화면을 그만큼 잡아먹는다) */
  .mvgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }

  /* 스탯 표 */
  table.stats { width: 100%; border-collapse: collapse; font-size: 12px; line-height: 1.35; }
  table.stats th { color: var(--muted); font-weight: 500; font-size: 11px; padding: 2px 3px; text-align: center; }
  table.stats td { padding: 2px 3px; text-align: center; }
  table.stats td.nm { text-align: left; color: var(--muted); width: 48px; white-space: nowrap; }
  table.stats td.bs { color: var(--muted); width: 30px; }
  table.stats td.rl { font-weight: 700; width: 40px; }
  table.stats input { width: 38px; padding: 1px 3px; font-size: 12.5px; text-align: center; height: 21px; }
  table.stats input::-webkit-outer-spin-button,
  table.stats input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .evcell { display: inline-flex; align-items: stretch; gap: 2px; }
  .evb {
    width: 19px; height: 21px; padding: 0; border: none; border-radius: 5px; cursor: pointer;
    color: #1b1d22; display: flex; align-items: center; justify-content: center;
  }
  .evb svg { width: 13px; height: 13px; display: block; }
  .evb.min { background: var(--bad); }
  .evb.max { background: var(--warn); }
  .evb:hover { filter: brightness(1.12); }
  .stepper { display: inline-flex; align-items: center; gap: 1px; }
  .stepper button, .natbtn {
    background: var(--panel2); border: 1px solid var(--line); color: var(--muted);
    border-radius: 5px; width: 20px; height: 20px; line-height: 1; padding: 0; cursor: pointer;
    font-family: inherit; font-size: 12px;
  }
  .stepper button:hover, .natbtn:hover { border-color: var(--accent); }
  .stepper .v { display: inline-block; width: 20px; font-weight: 700; }
  .stepper .v.up { color: var(--ok); } .stepper .v.down { color: var(--bad); }
  .natbtn.up { color: var(--ok); border-color: var(--ok); }
  .natbtn.down { color: var(--bad); border-color: var(--bad); }

  details.fold { margin-bottom: 5px; }
  details.fold > summary {
    font-size: 12px; color: var(--muted); cursor: pointer; list-style: none;
    padding: 5px 0; border-top: 1px solid var(--line);
  }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: "▸ "; }
  details.fold[open] > summary::before { content: "▾ "; }

  .btnrow { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
  .btnrow button {
    background: var(--panel2); border: 1px solid var(--line); color: var(--muted);
    border-radius: 7px; padding: 5px 11px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .btnrow button:hover { border-color: var(--accent); color: var(--txt); }

  /* ── 결과 열 ─────────────────────────────────────────────── */
  .out { display: flex; flex-direction: column; gap: 8px; }
  .out .card { padding: 10px 11px; }
  .out h2 { font-size: 15px; margin: 0 0 4px; }
  .rhead { color: var(--muted); font-size: 12px; margin-bottom: 9px; line-height: 1.55; }
  .empty { color: var(--muted); font-size: 13px; padding: 6px 0; line-height: 1.6; }

  /* 기술 한 줄 = 이름/타입 · 위력 · 데미지 · 판정. 누르면 상세 창이 뜬다. */
  .rrow {
    border: 1px solid var(--line); border-radius: 9px; background: var(--panel2);
    padding: 8px 10px; margin-bottom: 7px; cursor: pointer;
  }
  .rrow:hover { border-color: var(--accent); }
  .rrow .top { display: flex; align-items: center; gap: 6px; }
  .rrow .mv { font-weight: 700; font-size: 13.5px; flex: 1; min-width: 0;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rrow .pc { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .rrow .vd { font-size: 12.5px; font-weight: 700; }
  .rrow .sub { display: flex; align-items: center; gap: 7px; margin-top: 5px; font-size: 11.5px; color: var(--muted); }
  .pwcell { display: inline-flex; align-items: center; gap: 2px; }
  .pwv { min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--txt); font-size: 13px; }
  button.pwb {
    width: 20px; height: 20px; line-height: 1; padding: 0; cursor: pointer; font-family: inherit; font-size: 12px;
    background: var(--panel); border: 1px solid var(--line); color: var(--muted); border-radius: 5px;
  }
  button.pwb:hover { border-color: var(--accent); color: var(--txt); }
  span.pwb { display: inline-block; width: 20px; height: 20px; }
  .v-ko { color: var(--bad); } .v-maybe { color: var(--warn); } .v-safe { color: var(--ok); }
  .note { font-size: 11px; background: var(--panel); border: 1px solid var(--line);
          color: var(--muted); padding: 1px 7px; border-radius: 20px; }
  .speedline { margin-top: 5px; padding-top: 9px; border-top: 1px solid var(--line);
               font-size: 12.5px; color: var(--muted); }
  .speedline b { color: var(--txt); }

  /* ── 상세 창(스마트누오식) ───────────────────────────────── */
  .modal {
    position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  /* ★display를 주는 순간 [hidden](UA의 display:none)을 이겨 버린다 — 닫아도 계속 떠 있었다. */
  .modal[hidden] { display: none; }
  .modal .box {
    width: 400px; max-height: 86vh; overflow: auto; position: relative;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; box-shadow: 0 18px 48px rgba(0,0,0,.6);
  }
  .modal .x {
    position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; padding: 0;
    background: transparent; border: none; color: var(--muted); font-size: 16px; cursor: pointer;
    font-family: inherit;
  }
  .modal .x:hover { color: var(--txt); }
  .modal h3 { font-size: 14.5px; margin: 0 0 7px; display: flex; align-items: center; gap: 6px; }
  .modal h3.atk { color: var(--warn); }
  .modal h3.def { color: var(--ok); }
  .modal .kv { display: flex; gap: 9px; font-size: 13.5px; padding: 2px 0; }
  .modal .kv .k { color: var(--muted); min-width: 72px; }
  .modal .kv .v { color: var(--txt); }
  .modal .sect { margin-bottom: 14px; }
  .modal .big { font-size: 22px; font-weight: 800; margin-top: 5px; }
  .modal .rolls { font-size: 11.5px; color: var(--muted); line-height: 1.55; margin-top: 5px; word-break: break-all; }
  .modal .verdict { font-size: 15.5px; font-weight: 800; margin-top: 7px; }

  /* 한 줄 푸터 — 상표 고지만 남긴다(페이지를 늘리지 않게) */
  footer.mini {
    flex: none; border-top: 1px solid var(--line); padding: 5px 14px;
    font-size: 11.5px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
  }
  footer.mini a { color: var(--muted); }

  /* 좁은 화면 — 세 열은 최대한 지킨다(결과를 아래로 내리면 그만큼 높이를 뺏겨 오히려 더 잘린다).
     열 폭만 줄이고, 정말 좁아지면 그때 세로로 쌓으며 페이지 스크롤을 허용한다. */
  @media (max-width: 1500px) { :root { --rail: 168px; --out: 300px; --maxw: 1300px; } }
  @media (max-width: 1180px) { :root { --rail: 146px; --out: 248px; } }
  @media (max-width: 980px) {
    html, body { overflow: auto; height: auto; }
    .calcgrid { grid-template-columns: 1fr; height: auto; }
    .duel { grid-template-columns: 1fr; }
    .side, .rail, .out { overflow: visible; }
  }
</style>
  <link rel="stylesheet" href="/site-header.css" />
</head>
<body>

<div class="bootbar" id="boot"><span class="spin"></span><span id="bootMsg">계산 엔진 불러오는 중…</span></div>

<main id="app" class="calcgrid" hidden>

  <!-- 왼쪽 레일 — 모드 + 내 파티(세로) -->
  <aside class="rail">
    <div class="seg vert" id="mode">
      <button data-v="quick" class="on">빠른 계산</button>
      <button data-v="party">내 파티로 계산</button>
    </div>
    <div class="card" id="railBody"></div>
  </aside>

  <!-- 가운데 — 판 상황 + 두 포켓몬 -->
  <section class="board">
    <div class="field-bar">
      <div class="fb"><label>형식</label>
        <div class="seg small" id="fmt"><button data-v="0" class="on">싱글</button><button data-v="1">더블</button></div>
      </div>
      <div class="fb"><label>날씨</label><select id="weather"></select></div>
      <div class="fb"><label>필드</label><select id="terrain"></select></div>
      <div class="fb"><input type="checkbox" id="crit"><label for="crit">급소</label></div>
      <div class="fb"><input type="checkbox" id="spread"><label for="spread">광역기 ×0.75</label></div>
      <div class="fb" style="margin-left:auto"><label>시점</label>
        <div class="seg small" id="view"><button data-v="0" class="on">내가 공격</button><button data-v="1">상대가 공격</button></div>
      </div>
    </div>

    <div class="duel">
      <section class="side my"  id="sideMy"></section>
      <section class="side opp" id="sideOpp"></section>
    </div>
  </section>

  <!-- 오른쪽 — 결과 -->
  <aside class="out" id="result"></aside>
</main>

<!-- 기술 한 줄을 누르면 뜨는 상세 창 -->
<div class="modal" id="detail" hidden></div>
