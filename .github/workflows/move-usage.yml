name: Build move-usage

# 상대 기술 사용률(move-usage.json) 자동 갱신.
#   championsbattledata.com API (154차 소스 재교체 — pokedb 가 사용자 IP 차단)
#   → build/build-move-usage.py → helper-data/move-usage.json
#   master.json/sprites 와 독립(기술 사용률만 24h 주기로 따로 갱신 — 소스가 매일 갱신). 개발자 수동 개입 0.
#   릴레이 불요: championsbattledata 는 GitHub 러너 직접 접속 가능(123차 이전 cron 실적.
#   pokedb 시절의 pch-relay/secrets 는 미사용 — 만약 언젠가 403 이 나면 그 구조를 upstream 만 바꿔 재사용).
#   push 대상: dev(작업 브랜치) + dev:main(GitHub Pages 재배포) — 사이트 운영 규칙과 동일.

# ★169차 — 자동 실행 중단(cron 제거). usage 소스를 게임 공식 랭크 순위 데이터로 교체했다.
#   새 파이프라인 = 비공개 repo(pch-usage-pipeline)의 windows runner cron 이 helper-data/move-usage{,-double}.json 을
#   직접 갱신하고 도감/배틀데이터 페이지까지 재생성한다. 이 workflow 가 계속 돌면 공식 데이터를
#   championsbattledata 판으로 덮어쓰므로 cron 을 뺐다. 파일은 롤백 경로로 남겨둔다(수동 실행하면 구 소스 복귀).
on:
  workflow_dispatch: {}      # 수동 실행 전용(구 소스 롤백용)

permissions:
  contents: write

concurrency:
  group: move-usage
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build move-usage.json (싱글)
        run: python build/build-move-usage.py

      - name: Build move-usage-double.json (더블)
        # 131차 — 더블배틀 사용률. 싱글과 완전 별개 메타. build-mon-pages 가 이 json 을 로드해
        #   도감 상세 더블 섹션 + /battle-data/doubles/ 생성.
        run: python build/build-move-usage.py
        env:
          PCH_MOVE_RULE: "1"

      # 사이트 정적 페이지(도감 상세 사용기술/순위·배틀데이터·sitemap)도 새 데이터로 재생성(123차) —
      #   json 만 갱신하면 헬퍼는 최신인데 사이트 표시가 뒤처지는 갭 제거.
      - name: Rebuild pokedex/battle-data pages
        run: python build/build-mon-pages.py

      - name: Commit & push (dev + Pages)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helper-data/move-usage.json helper-data/move-usage-version.json \
                  helper-data/move-usage-double.json helper-data/move-usage-double-version.json \
                  pokedex battle-data sitemap.xml
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore: move-usage 싱글+더블 자동 갱신 (championsbattledata.com)"
          # 실행 중 다른 push가 끼면(희귀) 여기서 거부됨 — 이번 결과는 옛 체크아웃 기준 생성물이라
          # 덮어쓰지 않고 조용히 종료(다음 주기가 최신 코드로 재생성). 강제 병합 금지.
          if ! git push origin dev; then
            echo "push 경합 감지 — 이번 생성물 폐기, 다음 주기에 최신 코드로 재생성"
            exit 0
          fi
          git push origin dev:main   # dev:main = GitHub Pages 소스 → 재배포
