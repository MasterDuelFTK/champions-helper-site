<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />   <!-- 실시간 데이터 페이지 — 검색 색인 불필요 -->
<title>Pokémon Champions Helper — Live</title>
<!-- 87차 — Google AdSense 로더. 승인(ca-pub-XXXXXXXX 발급) 후 아래 주석을 해제하고 #ads의 ins도 활성화:
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXX" crossorigin="anonymous"></script>
-->
<script>
  // 87차(feedback#4) — 위력창을 공개 사이트(champions-helper.com/live)에서도 띄울 수 있게.
  //   데이터(WS)·시뮬 POST는 항상 로컬 헬퍼(127.0.0.1:8732)로 향해야 한다(헬퍼만 실시간 모델 보유).
  //   ① 헬퍼가 직접 서빙(127.0.0.1/localhost로 접속) → same-origin(빈 prefix) = 종전과 100% 동일.
  //   ② 사이트(champions-helper.com)에서 접속 → WS/POST는 로컬 헬퍼 절대주소, 그 외(애드센스는 공개 도메인에서만 표시 가능하므로 사이트 경유가 필수).
  //   https 사이트 → ws://127.0.0.1 은 loopback이라 브라우저가 mixed-content로 막지 않음(Chrome/Edge: localhost는 secure context 예외).
  // 106차 — Mixed Content 경고 제거: sprite/type-icon "이미지"는 로컬 헬퍼(http://127.0.0.1, IP host)에서 받으면
  //   https 페이지마다 "host is an IP address" 경고가 WS push마다 수십 개씩 폭증(콘솔 1000+). 이미지는 정적자산이라
  //   사이트 same-origin https(champions-helper.com/helper-data)에서 받게 분기 = http-IP 서브리소스 요청 자체가 사라짐.
  //   sprite 716개는 helper-data/sprites에 동일 파일명으로 호스팅 중, type-icon 18개는 helper-data/type-icons.
  (function () {
    // local = 헬퍼가 직접 서빙하는 페이지(127.0.0.1:8732)일 때만. 그 외(사이트·python 미리보기 localhost:8000 등)는
    //   전부 로컬 헬퍼 절대주소로 연결 → 미리보기/사이트 양쪽에서 동일하게 헬퍼(8732)에 붙는다.
    var loopback = location.hostname === "127.0.0.1" || location.hostname === "localhost";
    var local = loopback && location.port === "8732";
    window.PCH_HTTP  = local ? "" : "http://127.0.0.1:8732";
    window.PCH_WS    = local ? ("ws://" + location.host) : "ws://127.0.0.1:8732";
    // PCH_ASSET = sprite/type-icon 이미지 prefix. 헬퍼 직접 서빙이면 same-origin(""), 사이트 경유면 same-origin https(helper-data).
    window.PCH_ASSET = local ? "" : "https://champions-helper.com/helper-data";
    // 160차 — LNA(로컬 네트워크 액세스) 권한 게이트 판정용. 페이지 origin이 loopback이면(헬퍼 직접 서빙·python
    //   미리보기) 페이지 자체가 local 주소공간이라 크롬 LNA가 적용되지 않는다 → 게이트 통째 skip.
    window.PCH_LOOPBACK = loopback;
  })();
</script>
<style>
  :root {
    --bg: #1b1d22; --panel: #24272e; --panel2: #2b2f37; --line: #3a3f49;
    --txt: #e8eaed; --muted: #9aa0a8; --accent: #3a6fc8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--txt);
    font-family: "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
    font-size: 12px; display: flex; flex-direction: column; height: 100vh;
    overflow: hidden;  /* body 스크롤바 차단 — 스크롤은 #top/#mid 각자 담당 */
  }
  /* 상태/칩 바 */
  #bar {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 10px; background: var(--panel2); border-bottom: 1px solid var(--line);
    flex: 0 0 auto; flex-wrap: wrap;
  }
  /* 174차 — 좌(상태)/우(버전)를 같은 flex 비율로 두고 가운데 버튼을 정중앙 고정. */
  #status { font-size: 12px; color: var(--muted); flex: 1 1 0; min-width: 0; }
  #status.ok { color: #6fd08a; }
  #status.warn { color: #e0b000; }
  /* 98차 — /live 버전 표시(최상단 바 우측, 게임 요소 없는 구간). wwwroot↔사이트 동기화 추적용. */
  #version { font-size: 11px; color: var(--muted); flex: 1 1 0; text-align: right; opacity: 0.65; }
  /* 174차 — 배틀 상태 초기화(배틀 종료 멘트 미인식으로 다음 판 엔트리 인식이 안 될 때의 수동 탈출구). */
  #battle-reset {
    flex: 0 0 auto; font-size: 11px; padding: 2px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer;
  }
  #battle-reset:hover { color: var(--txt); border-color: var(--accent); }
  /* 매치업 타이틀 바(152차): [내 필드칩(좌)] [필드+날씨 드롭다운(정중앙)] [상대 필드칩(우)] — "매치업" 글자 삭제 */
  .mu-title-bar { display: flex; align-items: center; gap: 8px; margin: 0 0 2px 2px; }
  .field-chips { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  #mu-my-field, #mu-opp-field { flex: 1 1 0; }
  #mu-opp-field { justify-content: flex-end; }
  .mu-title-center { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; }
  /* 83차 — 필드 시뮬 드롭다운(날씨=중앙, 벽=상대측). 타이틀바 한 줄 유지(작게). 펼침은 네이티브라 세로 안 밀림. */
  .field-sel { font-size: 10px; font-weight: 700; color: var(--txt); background: #2a2e36; border: 1px solid var(--line); border-radius: 4px; padding: 1px 2px; cursor: pointer; max-width: 94px; vertical-align: middle; }
  .field-sel.sim-on { border-color: #FFEE00; border-width: 1.5px; color: #FFEE00; }
  /* 152차 — 실제 인식값 자동 드롭(필드/날씨 드롭다운): 순풍 tw-on과 같은 파란테. 시뮬(sim-on)과 구분. */
  .field-sel.real-on { border-color: #2E6FD8; border-width: 1.5px; color: #6fa8ff; }
  /* 127차 — 기타 배수(상태이상 옆). [−][직접 입력][＋] — 버튼은 기술 위력 -/+와 동일(.pbtn), 0.1 단위.
     네이티브 스피너는 숨김(누르기 어렵다는 피드백으로 pbtn 교체). ≠1이면 입력창 노란테. */
  .mult-wrap { display: flex; align-items: center; gap: 3px; }
  .mult-input { font-size: 11px; font-weight: 700; color: var(--txt); background: #2a2e36; border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; width: 40px; text-align: center; vertical-align: middle; appearance: textfield; -moz-appearance: textfield; }
  .mult-input::-webkit-outer-spin-button, .mult-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .mult-input.sim-on { border-color: #FFEE00; border-width: 1.5px; color: #FFEE00; }
  .chip {
    font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px;
    line-height: 1.5; white-space: nowrap;
  }
  /* 98차 — 순풍 토글(매치업 "순풍" 글씨). 테두리 색으로 상태 표시: 파란=실제 진행중 / 노란=시뮬 중 / 무(dim)=없음. */
  .tw-toggle { cursor: pointer; user-select: none; background: transparent; border: 1.5px solid #4a4f59; padding: 1px 6px; line-height: 1.3; }
  .tw-toggle.tw-on  { border-color: #2E6FD8; color: #6fa8ff; }
  .tw-toggle.tw-sim { border-color: #FFEE00; color: #FFEE00; }
  .tw-toggle.tw-off { border-color: #4a4f59; color: #8a909a; }
  /* 레이아웃 B: 상단 상대6(3열×2행, 가변) · 중앙 매치업+파티 · 하단 광고 */
  #top { flex: 0 1 auto; max-height: 46vh; overflow: auto; padding: 6px; border-bottom: 1px solid var(--line); }
  /* min-height:0 = flex 자식 축소 허용 → 내용 많아도 body 밖으로 안 넘침(스크롤은 이 안에서) */
  #mid { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 6px; display: flex; flex-direction: column; gap: 8px; }
  #ads {
    flex: 0 0 auto; min-height: 70px; display: flex; align-items: center; justify-content: center;
    background: var(--panel); border-top: 1px solid var(--line); color: var(--muted); font-size: 12px;
  }
  .section-title { font-size: 11px; color: var(--muted); margin: 0 0 4px 2px; font-weight: 700; }

  /* 상대 6슬롯 — 3열×2행 기본, 창 좁아지면 2열·1열로 가변 */
  .opps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 1000px) { .opps { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px)  { .opps { grid-template-columns: 1fr; } }
  /* 위력창 배치: 왼쪽 [sprite/이름/스피드] 세로 · 오른쪽 [기술 4개] */
  .oppslot { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px; display: flex; align-items: flex-start; gap: 8px; }
  .slot-left { flex: 0 0 auto; width: 78px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .slot-left .spr { width: 52px; height: 52px; object-fit: contain; image-rendering: pixelated; }
  .slot-name { font-weight: 700; font-size: 12px; text-align: center; line-height: 1.2; }
  .slot-moves { flex: 1 1 0; min-width: 0; }

  /* 매치업 */
  /* 83차 — 매치업 타이틀("매치업"+필드칩)을 박스 안 첫 줄로 통합(외부 별도 줄 제거 → 세로 절약). */
  .mu-box { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  #matchup { padding: 0; }
  /* 내(좌끝) | 기술+VS(중앙, 위 정렬) | 상대(우끝). 랭크칩은 sprite 옆 세로 — 내=왼/상대=오른. */
  .matchup-row { display: flex; align-items: stretch; gap: 16px; }
  .mu-side { display: flex; align-items: flex-start; gap: 6px; flex: 0 0 auto; }
  .mu-info { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .mu-info .spr { width: 60px; height: 60px; object-fit: contain; image-rendering: pixelated; }
  /* 110차 — 킬가르도 폼 전환 표식. sprite 우상단 원형화살표(클릭 시 블레이드↔실드 토글). */
  .spr-wrap { position: relative; display: inline-block; line-height: 0; }
  .spr-wrap.aegis { cursor: pointer; }
  .aegis-badge { position: absolute; top: -3px; right: -3px; width: 16px; height: 16px; line-height: 15px;
    font-size: 12px; font-weight: 700; text-align: center; color: #ffd24a; background: rgba(0,0,0,0.72);
    border: 1px solid #ffd24a; border-radius: 50%; pointer-events: none; }
  .mu-name { font-weight: 700; font-size: 14px; text-align: center; }
  /* 위력은 내 포켓몬 쪽(왼쪽)으로 — 중앙 정렬 안 함 */
  /* min-height: 메가 가능 포켓몬(내 원래 4행+내 메가 4행=8줄)일 때의 높이를 항상 예약 →
     비메가 포켓몬(4줄)을 내도 매치업 카드 세로가 고정되어 아래 시뮬 필드가 안 밀림(feedback#4). */
  .mu-center { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; min-height: 280px; }  /* 83차 — 226→280: 메가 8행 실측이 226 초과해 박스가 아래로 늘어나던 문제. 메가 높이를 충분히 예약해 고정. */
  .mu-vs { color: var(--muted); font-weight: 700; text-align: center; margin-bottom: 4px; }

  /* 위력 행/샘플 (PowerRowRenderer 포팅) */
  .col { display: flex; flex-direction: column; gap: 1px; }
  .row { display: grid; grid-template-columns: 72px 1fr; align-items: center; gap: 4px; position: relative; }  /* position: 급소 체크박스 absolute 기준 */
  .mname { font-weight: 700; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .samples { display: flex; flex-wrap: wrap; gap: 2px; }
  /* 모든 위력칩 동일 폭(세자리수~세자리수 "147~173%" 기준 고정) */
  .sample {
    font-size: 11px; color: #181818; padding: 1px 3px; border-radius: 3px;
    width: 64px; box-sizing: border-box; text-align: center; line-height: 1.5;
  }
  .muted { color: var(--muted); font-size: 11px; }

  /* 93차 — 조건부 위력 기술 -/+ 버튼. 위력칩 위치를 절대 안 밀도록:
     −버튼 + +n 지표는 기술명 칸(grid col0, 고정폭) 안에, +버튼은 위력칩 뒤에 둔다.
     → 위력칩(.samples)은 항상 grid 1fr 칸 시작 = 모든 행(조건부/비조건부) 동일 x좌표로 수직 정렬. 기술명은 잘려도 됨. */
  .mname.has-ctl { display: flex; align-items: center; gap: 2px; }
  .mname.has-ctl .mtext { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pdelta { flex: 0 0 auto; font-size: 9px; font-weight: 700; color: #ffd54f; }
  .samples-ctl { display: flex; align-items: center; gap: 3px; }
  .pbtn {
    flex: 0 0 auto; cursor: pointer; user-select: none;
    min-width: 15px; height: 16px; line-height: 14px; text-align: center; padding: 0 1px;
    font-size: 12px; font-weight: 700; color: var(--txt);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 3px;
  }
  .pbtn:hover { border-color: var(--accent); color: var(--accent2); }

  /* (feedback#1) 중앙 매치업 위력칩은 한 줄 강제 — -/+ 버튼·메가 컬럼이 함께 있어도 칩이 아래로 줄바꿈되지 않게
     (원래 컬럼이 넓어지면 메가 컬럼이 자연히 오른쪽으로 밀린다). 6슬롯(.slot-moves)·기타는 기존 wrap 유지. */
  .mu-center .samples { flex-wrap: nowrap; }
  /* (feedback#2 재수정) 급소 체크박스·"급소" 라벨은 grid 칸을 차지하지 않고 absolute로 기술명 왼쪽 "얇은 틈"
     (매치업 gap)에 띄운다 → 위력칩 grid(72px 1fr)는 급소 없을 때와 100% 동일.
     ⇒ 내 원래/내 메가 섹션 칩이 정확히 같은 라인 + 위력칩 위치 안 밀림. -/+ 버튼은 lcol(내용폭) 안이라 sep는 +버튼 오른쪽. */
  .crit-label { position: absolute; left: -17px; top: 50%; transform: translateY(-50%);
    font-size: 8px; color: var(--muted); font-weight: 700; line-height: 1; white-space: nowrap; }
  .crit-box { position: absolute; left: -16px; top: 50%; transform: translateY(-50%);
    width: 13px; height: 13px; margin: 0; cursor: pointer; accent-color: #E05656; }

  /* 방어자 변형 블록 (원래 | 메가X | 메가Y) */
  .dblock { display: flex; align-items: flex-start; }
  .dblock .sep { width: 1px; align-self: stretch; background: rgba(255,255,255,0.3); margin: 0 6px; }
  .lcol { flex: 0 0 auto; min-width: 0; }   /* 내용폭(칩+버튼)만큼 → sep(구분선)가 +버튼 오른쪽에 위치, 옆 컬럼 침범 안 함 */
  .lhdr { font-size: 10px; font-weight: 700; margin-bottom: 2px; position: relative; }  /* position: "급소" 라벨 absolute 기준 */
  .asec { margin-bottom: 6px; }
  .ahdr { font-size: 12px; font-weight: 700; margin-bottom: 2px; }

  /* 스피드 칩 */
  .spline { display: flex; gap: 2px; margin-top: 2px; }
  /* 170차 — 추정/시뮬 테두리(파란·노란)를 얹어도 글씨 높이가 안 밀리도록 *모든* 칩에 투명 2px 테두리를 기본 부여.
     (테두리를 한 칩에만 추가하면 그 칩만 박스가 2px 커져 글씨가 아래로 내려간다 — 사용자 지적.) */
  .spchip { font-size: 10px; font-weight: 700; color: #181818; padding: 0 4px; border-radius: 3px; min-width: 22px; text-align: center;
    border: 2px solid transparent; box-sizing: border-box; }
  .myspchip { font-size: 11px; font-weight: 700; color: #fff; background: var(--accent); padding: 1px 8px; border-radius: 3px; display: inline-block; }
  .fhdr { font-size: 9px; font-weight: 700; color: #b0b0b0; margin-top: 1px; }

  /* 랭크 배지 */
  /* 고정폭 + 배경/경계로 명시적 칸. align-self stretch → 매치업 카드 세로 전체에 맞춤(포켓몬 높이 X) */
  .ranks-v {
    display: flex; flex-direction: column; gap: 2px;
    flex: 0 0 64px; width: 64px; box-sizing: border-box; align-self: stretch;
    background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); border-radius: 5px; padding: 3px;
  }
  /* 랭크칩 색 = 위력창 stat별 색(JS가 배경 인라인). 밝은 배경 → 어두운 글자 */
  .rank { font-size: 10px; font-weight: 700; padding: 1px 4px; border-radius: 6px; text-align: center; white-space: nowrap; color: #181818; }

  /* 파티 화이트리스트 */
  .parties { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .pcol { flex: 0 1 auto; }
  .pcol.right { text-align: right; }
  .pcol.right .party { justify-content: flex-end; }
  .party { display: flex; gap: 5px; flex-wrap: wrap; }
  .pmon { background: var(--panel2); border: 2px solid transparent; border-radius: 6px; padding: 3px; width: 64px; text-align: center; }
  .pmon.cur { border-color: var(--accent); }
  .pmon.sim { border-color: #ffee00; }
  .pmon .spr { width: 48px; height: 48px; object-fit: contain; image-rendering: pixelated; }
  .pname { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 81차 — sprite 옆/아래 타입 아이콘(변환자재·메가로 바뀐 타입 실시간 반영). */
  .type-row { display: flex; gap: 2px; justify-content: center; flex-wrap: wrap; }
  .type-ic { height: 14px; width: auto; object-fit: contain; image-rendering: auto; border-radius: 2px; }
  .mu-info .type-ic { height: 16px; }
  .sim-tag { font-size: 11px; color: #ffee00; font-weight: 700; margin-left: 6px; }

  /* 74차(Phase3) — 시뮬 조작 패널(브라우저→데스크탑 POST /api/sim/*) */
  .pmon.clickable { cursor: pointer; }
  .pmon.clickable:hover { border-color: #ffee00; }
  .sim-panel {
    margin-top: 4px; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 6px; text-align: left; max-width: 360px;
  }
  .pcol.right .sim-panel { margin-left: auto; }   /* 상대 패널 우측 정렬되 내용은 좌측 */
  .sim-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .sim-head-name { font-weight: 700; font-size: 13px; color: #ffee00; }
  .sim-sub { font-size: 10px; color: var(--muted); font-weight: 700; margin: 2px 0 0; }
  .adj-row { display: grid; grid-template-columns: 52px 24px 1fr 24px; align-items: center; gap: 5px; margin: 3px 0; }  /* feedback#3 — 상하 간격 약간 넓힘 */
  .adj-label { font-size: 11px; }
  .adj-val { font-size: 12px; font-weight: 700; text-align: center; min-width: 38px; }
  .btn {
    font-size: 12px; font-weight: 700; color: var(--txt); background: #353a44;
    border: 1px solid var(--line); border-radius: 4px; padding: 0; cursor: pointer; line-height: 1.15;
  }
  .btn:hover { background: #424955; }
  .btn:active { background: #2a2e36; }
  .btn.mega { padding: 2px 12px; background: #9f4fc0; color: #fff; }
  .btn.mega:hover { background: #b266d4; }
  .btn.mega.on { background: #6f2e90; }
  /* 91차 — 파티 블록 중앙(좌=내 시뮬/우=상대 시뮬 사이 빈 공간)의 "모든 시뮬 취소" 버튼.
     좌우와 동일한 세로 구조(column, 위→아래)로 두고 빈 제목 placeholder로 sprite 행 높이에 맞춤 →
     버튼이 포켓몬 sprite 라인에 고정(시뮬 패널이 길어져도 세로로 안 밀림). align-items=가로 중앙만. */
  .pcol.center { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .btn.sim-reset {
    padding: 9px 16px; font-size: 12px; white-space: nowrap; border-radius: 6px;
    background: #B03030; color: #fff; border: 1px solid #E05656;
  }
  .btn.sim-reset:hover { background: #C84242; }
  .btn.sim-reset:active { background: #952626; }
  /* 지닌도구 드롭다운(헤더 클릭 펼침) */
  .dropdown { max-width: 200px; }
  /* 170차 — 펼침 목록의 기준점. 안내문(.conf-note)을 포함한 .dropdown 기준이면 목록이 안내문 아래로 떨어져 뜬다
     → 헤더만 감싸는 anchor를 기준으로 삼아 헤더 바로 아래에 붙인다(사용자 지적). */
  .dd-anchor { position: relative; }
  .dd-header {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; font-weight: 700; color: var(--txt); background: #353a44;
    border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; cursor: pointer;
  }
  .dd-header:hover { background: #424955; }
  .dd-arrow { color: var(--muted); font-size: 10px; margin-left: 8px; flex: 0 0 auto; }
  /* 160차(feedback) — 긴 이름(메타그로스나이트 등)이 두 줄로 접혀 패널 높이가 튀던 것 → 한 줄 고정.
     폭을 넘치면 fitOneLine()이 폰트를 12→9px까지 줄이고, 그래도 모자라면 말줄임(…)이 받는다. */
  /* ★flex-grow는 0 — 늘리면 span이 남는 폭을 채우고, 헤더가 button이라 기본 text-align:center가 상속돼
     짧은 이름이 가운데로 밀린다(실사고). 줄어들기만 하면 되므로 0 1 auto + 명시적 좌측정렬. */
  /* ★padding-right = 이탤릭(「추정」 표시) 마지막 획이 글자 폭 바깥으로 삐치는 만큼의 여유.
     scrollWidth는 그 삐침을 안 세므로 "안 넘침"으로 판정되는데 overflow:hidden은 잘라버린다 → 끝 글자 잘림.
     margin-right로 상쇄해 실제 레이아웃 폭은 그대로 유지(다른 요소 밀림 없음). */
  .dd-label { flex: 0 1 auto; min-width: 0; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding-right: 3px; margin-right: -3px; }
  .ab-fixed .ab-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 3px; margin-right: -3px; }
  /* 펼침 목록은 흐름 밖(absolute)으로 띄워 아래 노력치/성격 행을 밀어내지 않음 */
  .dd-list {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 50; margin-top: 2px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    max-height: 264px; overflow-y: auto; overflow-x: hidden; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
  }
  .dd-opt { font-size: 12px; padding: 5px 8px; cursor: pointer; }
  .dd-opt:hover { background: #424955; }
  .dd-opt.sel { background: var(--accent); color: #fff; font-weight: 700; }
  .dd-grp { font-size: 10px; color: var(--muted); font-weight: 700; padding: 6px 8px 2px; border-top: 1px solid #3a3f48; }
  /* 83차 — 지닌도구+특성 수평 2칸(세로 스크롤 제거). 각 칸 안에서 드롭다운이 칸 폭 채움 */
  .sim-cols { display: flex; gap: 10px; align-items: flex-start; }
  .sim-cols > .sim-col { flex: 1 1 0; min-width: 0; }
  /* 82차 — 상대 시뮬 특성: 이름 + 그 아래 작은 글씨 효과 설명 */
  .ab-name { font-size: 12px; font-weight: 700; }
  .ab-desc { font-size: 10px; color: var(--muted); line-height: 1.35; margin-top: 2px; white-space: normal; }
  .ab-fixed { max-width: 200px; padding: 4px 8px; background: #353a44; border: 1px solid var(--line); border-radius: 4px; }
  .ab-cur-desc { max-width: 200px; font-size: 10px; color: var(--muted); line-height: 1.35; margin-top: 3px; white-space: normal; }
  /* 147차 — 파란테(현재 나온 상대) 확정 패널. 시뮬(노란)과 구분해 파란 계열 강조 = 파티행 파란 테두리와 같은 의미. */
  .sim-panel.confirm { border-color: #4aa3ff; }
  .conf-tag { font-size: 11px; color: #7ab0ff; font-weight: 700; margin-left: 6px; }
  /* 「추정」(채용률 1위 자동값) = 흐리게 / 「확정」(사용자 지정) = 또렷 — 사용자 채택 시각 구분 */
  .dd-header.est, .ab-fixed.est { opacity: 0.62; font-style: italic; }
  .dd-header.conf { border-color: #4aa3ff; color: #cfe6ff; }
  /* 170차 — 시뮬에서 직접 고른 값(노란테 = 위력칩 노란 테두리와 같은 의미) */
  .dd-header.simset { border-color: #ffee00; color: #fff3a0; }
  .conf-note { font-size: 10px; color: var(--muted); line-height: 1.35; margin-top: 3px; white-space: normal; }
  .dd-pct { font-size: 10px; color: var(--muted); margin-left: 4px; }

  /* 113차 — 상대 시점 모드("상대" 토글, 모든 시뮬 취소 위). on=초록 활성. */
  .btn.opp-persp {
    padding: 6px 16px; font-size: 12px; white-space: nowrap; border-radius: 6px; margin-bottom: 6px;
    background: #2f3742; color: var(--txt); border: 1px solid var(--line);
  }
  .btn.opp-persp:hover { background: #3a4450; }
  .btn.opp-persp.on { background: #2f7d4f; color: #fff; border-color: #41a06a; }
  /* 113차 — 상대 시점: 6슬롯/매치업 위력칩을 "오른쪽에서부터"(상대 입장 거울). sprite를 오른쪽, 기술블록 왼쪽. */
  .oppslot.mirror { flex-direction: row-reverse; }
  .oppslot.mirror .slot-moves { text-align: left; }
  /* 113차 — 상대 기술 편집: 기술명 클릭 가능 + datalist 입력칸(드롭다운+직접입력). */
  .mname.editable { cursor: pointer; text-decoration: underline dotted rgba(255,255,255,0.4); text-underline-offset: 2px; }
  .mname.editable:hover { color: #ffd54f; }
  .opp-move-input {
    width: 140px; font-size: 11px; font-weight: 700; color: var(--txt);
    background: #2a2e36; border: 1px solid var(--accent); border-radius: 3px; padding: 1px 3px;
  }
  /* 170차 — 특성 드롭다운 맨 아래 "직접 입력" 행(스킬스왑 등 전 특성 지정). 항목처럼 hover 강조는 안 준다. */
  .dd-opt.dd-input { cursor: default; padding: 4px 6px; }
  .dd-opt.dd-input:hover { background: transparent; }
  .ab-input { width: 100%; box-sizing: border-box; }
  /* 122차 — 상단 6슬롯 이름 클릭 → 종족 교체(오인식 수동 정정). 내 시점(상대 파티)만. */
  .slot-name.editable { cursor: pointer; text-decoration: underline dotted rgba(255,255,255,0.4); text-underline-offset: 2px; }
  .slot-name.editable:hover { color: #ffd54f; }
  .opp-name-input {
    width: 92px; font-size: 11px; font-weight: 700; color: var(--txt);
    background: #2a2e36; border: 1px solid var(--accent); border-radius: 3px; padding: 1px 3px;
  }
  /* 113차 — 상대 시점 center: 위력칩을 오른쪽(상대 공격자 sprite 쪽)으로. 내 포켓몬(왼쪽)에 안 붙게.
     col을 full width로 펴고(stretch) 각 행을 justify-end → 위력칩이 오른쪽 끝(상대 쪽)에 정렬. */
  .mu-center.opp-persp { align-items: stretch; }
  .mu-center.opp-persp > .col { width: 100%; }
  /* flex justify-end: [기술명 96 고정][위력칩 wrap] 전체를 오른쪽(상대 쪽)으로. 모든 요소 고정폭 → 밀림 없이 정렬. */
  .opp-mrow { display: flex; align-items: center; gap: 6px; justify-content: flex-end; width: 100%; }
  .opp-mrow .mname { flex: 0 0 96px; overflow: hidden; }
  .opp-mrow .samples { flex: 0 0 196px; flex-wrap: nowrap; overflow: hidden; }  /* 고정폭 — 변화기(칩 없음)여도 폭 유지 → 정렬 */
  .chips-wrap { display: flex; align-items: center; gap: 6px; }
  .chips-wrap .pbtn { flex: 0 0 auto; box-sizing: border-box; width: 18px; min-width: 18px; padding: 0; }  /* spacer와 동일 폭 */
  .chips-wrap .pbtn-spacer { flex: 0 0 auto; width: 18px; }  /* +버튼과 정확히 같은 폭 → 밀림 0 */
  /* 114차 — 상대 시점 급소 체크박스: mname 왼쪽 flex 아이템(고정폭). chips/mname은 우정렬 고정폭이라 정렬 유지. */
  .opp-mrow .opp-crit-box { flex: 0 0 auto; width: 13px; height: 13px; margin: 0; cursor: pointer; accent-color: #E05656; }
  .edit-wrap { display: flex; align-items: center; gap: 4px; }
  .edit-clear { cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 700; padding: 0 5px; user-select: none; }
  .edit-clear:hover { color: #E05656; }
  /* 113차 — 메가 두 줄: 내 원래|내 메가 구분선 + "상대 메가 시" 헤더. */
  .mega-sep { width: 1px; align-self: stretch; background: rgba(255,255,255,0.3); margin: 0 4px; }
  .slot-mega-hdr { font-size: 9px; font-weight: 700; color: #b0b0b0; margin: 4px 0 1px; }
  /* 113차 — 상대 시점 center 컬럼 헤더([내 원래]|[메가OO]). col-lbl 폭=위력칩 3개(64×3+gap≈196)와 정렬. */
  .opp-mega-block { margin-bottom: 5px; }
  .opp-col-hdr .col-lbl { width: 196px; text-align: center; font-size: 9px; font-weight: 700; color: #9aa0a8; }
  .opp-col-hdr .mname { visibility: hidden; }
  /* 줄 헤더("상대 원래"/"메가OO 시")도 위력칩(우정렬)에 맞춰 오른쪽 정렬 — 왼쪽 sprite에 안 붙게. */
  .mu-center.opp-persp .slot-mega-hdr { text-align: right; }
  /* 113차 — "실제 수치" 토글: 광고 영역 바로 위 고정 바(flex item — 광고와 안 겹침). on=초록(실 데미지).
     120차 — "선출 정보" 버튼 동승: 두 버튼이 함께 중앙 정렬(gap). 클릭=선출 정보 모달 열기(아래 #pick-modal). */
  #real-toggle-bar { flex: 0 0 auto; display: flex; justify-content: center; gap: 10px; padding: 4px 0; background: var(--panel2); border-top: 1px solid var(--line); }
  .real-toggle {
    font-size: 11px; font-weight: 700; padding: 4px 16px; border-radius: 14px; cursor: pointer;
    background: #2f3742; color: var(--txt); border: 1px solid var(--line);
  }
  .real-toggle:hover { background: #3a4450; }
  .real-toggle.on { background: #2f7d4f; color: #fff; border-color: #41a06a; }
  /* 120차 — 선출 정보 모달(계산 = 열기·다시계산·상대파티 변경 시 1회씩).
     121차 — UI 재설계: 추천 트리오 카드 + 팀 경고 배지 + 6×6 히트맵 그리드(줄글 나열 폐기). */
  #pick-modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 900; display: none; align-items: center; justify-content: center; }
  #pick-modal .pick-box { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; width: min(1080px, 96vw); max-height: 90vh; display: flex; flex-direction: column; }
  .pick-hdr { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .pick-title { font-size: 15px; font-weight: 800; }
  .pick-status { font-size: 11px; color: #9aa0a8; }
  .pick-close { margin-left: 4px; background: transparent; border: none; color: #9aa0a8; font-size: 16px; cursor: pointer; }
  .pick-close:hover { color: #fff; }
  .pick-body { overflow-y: auto; padding: 8px 14px 12px; }
  /* 세그먼트 채색(120차 사용자 지시 유지): 내게 유리한 사실=빨강 / 불리한 사실=파랑. 중립=기본 회색. */
  .pick-good { color: #ff7a7a; font-weight: 700; }
  .pick-bad { color: #6fa8ff; font-weight: 700; }
  .pick-caveat { font-size: 10.5px; color: #6e7683; padding: 8px 2px 2px; }
  .pick-wait { padding: 40px 10px; text-align: center; color: #9aa0a8; font-size: 13px; line-height: 1.7; }
  /* 121차 — 추천 트리오 카드(상단). 1순위=주황 테두리 강조, ★선봉 배지. */
  .pick-sec-title { font-size: 12px; font-weight: 800; margin: 6px 0 3px; color: #e8eaed; }
  .pick-reco-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 2px 0 6px; }
  .pick-reco { flex: 1 1 250px; min-width: 220px; background: #232a33; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .pick-reco.best { border-color: #c96a4a; box-shadow: 0 0 0 1px rgba(201,106,74,.35); }
  .pick-reco-rank { font-size: 11px; font-weight: 800; color: #9aa0a8; margin-bottom: 4px; }
  .pick-reco.best .pick-reco-rank { color: #ff9a7a; }
  .pick-reco-mons { display: flex; gap: 10px; }
  .pick-reco-mon { display: flex; flex-direction: column; align-items: center; width: 58px; }
  .pick-reco-mon img { width: 36px; height: 36px; image-rendering: pixelated; }
  .pick-reco-mon .nm { font-size: 9.5px; color: #c7ccd4; max-width: 58px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick-lead-badge { font-size: 8.5px; font-weight: 800; color: #ffd479; }
  .pick-reco-reasons { margin-top: 5px; font-size: 10.5px; color: #9aa0a8; line-height: 1.55; }
  /* 121차 — 팀 경고 배지(순풍/트릭룸/장판/벽). */
  .pick-warn-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 6px; }
  .pick-warn { font-size: 10.5px; font-weight: 700; color: #ffb86b; background: #3a2f22; border: 1px solid #6b5230; border-radius: 10px; padding: 2px 8px; }
  /* 121차 — 6×6 히트맵 그리드. 셀 배경 = 듀얼 판정(유리 빨강/불리 파랑/반반 회색), 클릭 = 하단 상세. */
  .pick-legend { font-size: 10px; color: #6e7683; margin: 6px 0 2px; }
  .pick-grid-wrap { overflow-x: auto; }
  table.pick-grid { border-collapse: collapse; width: 100%; }
  .pick-grid th, .pick-grid td { border: 1px solid var(--line); padding: 3px 4px; text-align: center; }
  .pick-grid th { background: #20262e; font-weight: 700; font-size: 10px; color: #c7ccd4; }
  .pick-grid th img { width: 30px; height: 30px; image-rendering: pixelated; display: block; margin: 0 auto; }
  .pick-grid td.me { text-align: left; background: #20262e; min-width: 108px; font-size: 11px; }
  .pick-grid td.me img { width: 28px; height: 28px; image-rendering: pixelated; vertical-align: middle; margin-right: 4px; }
  .pick-me-sub { font-size: 9px; color: #9aa0a8; margin-top: 1px; }
  .pick-cell { cursor: pointer; min-width: 72px; font-size: 10.5px; line-height: 1.45; position: relative; padding-right: 15px !important; }
  .pick-cell:hover { outline: 1px solid rgba(255,255,255,.3); }
  .pick-cell.sel { outline: 2px solid #ffd479; }
  .pick-cell .spd { position: absolute; top: 2px; right: 3px; font-size: 9px; color: #9aa0a8; }
  .pick-c-good { background: rgba(255,90,90,.16); }
  .pick-c-bad { background: rgba(90,140,255,.15); }
  .pick-c-mid { background: rgba(255,255,255,.03); }
  .pick-badges { font-size: 10px; letter-spacing: 1px; margin-top: 1px; cursor: default; }
  /* 121차 — 셀 클릭 상세 패널(그리드 아래). */
  .pick-detail { margin-top: 8px; background: #20262e; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 11.5px; color: #c7ccd4; line-height: 1.65; display: none; }
  .pick-reason { font-size: 10.5px; color: #9aa0a8; }

"use strict";
const $ = (s) => document.querySelector(s);
let lastModel = null;      // 74차 — 드롭다운 펼침 토글 시 재렌더용 최신 모델
let oppItemOpen = false;   // 74차 — 상대 도구 드롭다운 펼침 상태(WS 갱신에도 유지)
let myItemOpen = false;    // 107차 — 내 도구 드롭다운 펼침 상태
let oppAbilityOpen = false; // 82차 — 상대 특성 드롭다운 펼침 상태
let confItemOpen = false;   // 147차 — 파란테(현재 상대) 확정 도구 드롭다운 펼침 상태

let confMyItemOpen = false; // 160차 — 내 확정 도구 드롭다운 펼침 상태

let oppEditSlot = null;     // 113차 — 상대 시점 기술 편집 중인 슬롯(0~3, null=없음)
let oppNameEditIdx = null;  // 122차 — 상단 6슬롯 종족 교체 편집 중인 슬롯(0~5, null=없음). 내 시점만.

// ── 색 규칙 (PowerRowRenderer 포팅) ──────────────────────────
const LABEL_BG = { White: "#FFFFFF", LightGreen: "#C8F0C0", Orange: "#FFC880", LightPink: "#FFC8DC",
  // 113차 — 상대 시점: 물리기=붉은(공격 랭크색 #F09B9B), 특수기=보라(특공 랭크색 #C8A2E0). 흰→약간→진.
  PhysMid: "#F6C1C1", PhysFull: "#F09B9B", SpecMid: "#DBC4EE", SpecFull: "#C8A2E0" };
const FORM = { base: "#C8C8C8", megaX: "#FF9F9F", megaY: "#FFC890", myMega: "#9FD0FF" };
const STAT_KO = ["공", "방", "특공", "특방", "스피드"];   // 랭크·성격 인덱스(0~4)
const EV_KO = ["HP", "공", "방", "특공", "특방", "스피드"]; // 노력치 인덱스(0~5)
// 107차 — 내 도구 시뮬 목록(탁쳐떨구기로 제거/트릭으로 교체된 도구 대응). 그룹별 분류 표시.
const MY_ITEM_GROUPS = [
  { label: "위력", items: ["생명의구슬", "달인의띠", "힘의머리띠", "박식안경", "구애머리띠", "구애안경", "전기구슬"] },
  { label: "스피드", items: ["구애스카프", "검은철구"] },
  { label: "타입강화 ×1.2", items: ["실크스카프", "목탄", "신비의물방울", "기적의씨", "자석", "부드러운모래", "용의이빨", "검은띠", "독바늘", "예리한부리", "휘어진스푼", "은빛가루", "딱딱한돌", "저주의부적", "검은안경", "금속코트", "녹지않는얼음", "요정의깃털"] },
  // 170차(feedback) — 반감열매 18종. 그 타입 기술을 "효과 굉장"으로 맞을 때 받는 데미지 ×0.5(카리열매=노말은 굉장 조건 없음).
  //   계산은 ItemRegistry.ResistBerries + DamageCalculator 단일 경로(내/상대 시점·시뮬·확정·채용률 추정 전부 자동).
  { label: "반감열매 ×0.5", items: ["오카열매", "꼬시개열매", "초나열매", "린드열매", "플카열매", "로플열매", "으름열매", "슈캐열매", "바코열매", "야파열매", "리체열매", "루미열매", "수불열매", "하반열매", "마코열매", "바리비열매", "로셀열매", "카리열매"] },
];
// 66차 가정 도구(107차 검은철구=스피드½ 추가) 중 방어 전용 — 구애스카프/검은철구는 스피드 그룹에 이미 있어 중복 제외.
const OPP_ITEMS_DEF = ["돌격조끼", "진화의휘석"];
// 149차(feedback) — 상대 도구 시뮬 = 내 도구와 같은 전체 목록 + 방어 도구. 종전엔 내 시점에서 5종(돌격조끼/구애스카프/
//   진화의휘석/검은철구)만 골랐는데, 상대 도구(_oppSimItemKo)는 시점 공유 단일 상태라 내 시점에서 지정한 도구가
//   상대 시점 위력(동시 위력 모드의 상대 탭 포함)에도 그대로 흐른다 → 목록을 시점별로 나눌 이유가 없다.
//   공격 도구는 상대가 방어자일 때 계산에 안 걸리고(ItemRegistry isAttackerSide), 방어 도구는 상대가 공격자일 때
//   안 걸리므로 전체 노출이 안전(오적용 0).
const OPP_ITEM_GROUPS = MY_ITEM_GROUPS.concat([{ label: "방어", items: OPP_ITEMS_DEF }]);
// 위력창 stat별 색(공=붉은/방=주황/특공=보라/특방=연분홍/스피드=하늘)
const STAT_COLOR = ["#F09B9B", "#FFC880", "#C8A2E0", "#FFC8DC", "#B0E0F0"];
function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt != null) e.textContent = txt;
  // 108차 — form field(select/input/textarea)는 id/name 없으면 DevTools가 autofill 권고 경고를 띄운다
  //   ("A form field element should have an id or name attribute"). 동적 생성이라 의미있는 고유 id가 없으므로
  //   className 첫 토큰을 name으로 부여해 경고만 제거(form 태그 없어 submit 무관, 기능 영향 0).
  if (cls && (tag === "select" || tag === "input" || tag === "textarea")) e.name = cls.split(" ")[0];
  return e;
}
// hex 색을 흰색 쪽으로 amt(0~1) 섞어 연하게(채도↓·밝기↑). 랭크 다운 칩에 사용.
function lighten(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const mix = (c) => Math.round(c + (255 - c) * amt);
  return "#" + [mix(r), mix(g), mix(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
}

// ── 위력 컬럼/행/샘플 ────────────────────────────────────────
function renderColumn(col, withControls) {
  if (!col || !col.rows || !col.rows.length) return null;
  const d = el("div", "col");
  col.rows.forEach((r) => d.appendChild(renderRow(r, withControls)));
  return d;
}
function renderRow(row, withControls) {
  const g = el("div", "row");
  // 93차 — withControls(오리지널 컬럼) + 조건부 위력 기술이면 기술명 옆 +n + 위력칩 양쪽 -/+ 버튼.
  const ctl = withControls && !!row.moveKey;
  // feedback#2 — 급소 체크박스(모든 기술). withControls(원래 컬럼)만, 기술명 왼쪽 얇은 틈에 absolute(칩 배치 영향 0).
  if (withControls && row.moveNameEn) {
    const cb = el("input", "crit-box");
    cb.type = "checkbox";
    cb.checked = !!row.critActive;
    cb.title = "급소 (체크 시 위력 ×1.5)";
    cb.onchange = () => sim("/api/sim/crit", { moveNameEn: row.moveNameEn });
    g.appendChild(cb);
  }
  const n = el("div", "mname");
  if (ctl) {
    n.classList.add("has-ctl");
    n.appendChild(el("span", "mtext", row.moveNameKo));
    const delta = (row.currentPower || 0) - (row.basePower || 0);
    if (delta !== 0) n.appendChild(el("span", "pdelta", (delta > 0 ? "+" : "") + delta));
    // −버튼은 기술명 칸(고정폭) 오른쪽 끝 = 위력칩 바로 왼쪽. 위력칩 위치는 안 밀린다.
    const minus = el("span", "pbtn", "−");
    minus.title = "위력 단계 내리기";
    minus.onclick = () => sim("/api/sim/move-power", { moveKey: row.moveKey, delta: -1 });
    n.appendChild(minus);
  } else {
    n.textContent = row.moveNameKo;
  }
  n.title = row.moveNameKo;
  g.appendChild(n);

  const sp = el("div", "samples");
  if (row.unknown) sp.appendChild(el("span", "muted", "미등록"));
  else if (row.isStatus || !row.samples || !row.samples.length) sp.appendChild(el("span", "muted", "변화기"));
  else row.samples.forEach((s) => sp.appendChild(renderSample(s)));

  if (ctl) {
    // 위력칩(sp)은 grid 1fr 칸 시작 그대로 → 비조건부 행과 동일 x. +버튼만 위력칩 오른쪽에 붙는다.
    const wrap = el("div", "samples-ctl");
    const plus = el("span", "pbtn", "+");
    plus.title = "위력 단계 올리기";
    plus.onclick = () => sim("/api/sim/move-power", { moveKey: row.moveKey, delta: 1 });
    wrap.appendChild(sp); wrap.appendChild(plus);
    g.appendChild(wrap);
  } else {
    g.appendChild(sp);
  }
  return g;
}
function renderSample(s) {
  // s.text(%) / s.damageText(실 데미지) / s.canKo / s.guaranteedKo 는 C# 계산 프로퍼티 → JSON에 포함됨.
  // "실제 수치" 토글 시 s.damageText(HP 절대값), 아니면 % 표기.
  const txt = showRealDamage ? (s.damageText || s.text) : s.text;
  const b = el("span", "sample", txt);
  b.style.background = LABEL_BG[s.color] || "#fff";
  if (s.guaranteedKo) b.style.fontWeight = "bold";
  if (s.simulated) b.style.border = "2px solid #FFEE00";          // 시뮬 노력치/성격 반영 (KO보다 우선)
  else if (s.estimated) b.style.border = "2px solid #4AA3FF";     // 170차 — 추정·확정 노력치가 가리키는 칸(파란)
  else if (s.guaranteedKo) b.style.border = "2px solid #D22020";  // 확정 1타
  else if (s.canKo) b.style.border = "1.5px solid #E08000";       // 난수 1타
  else b.style.border = "1px solid rgba(0,0,0,0.375)";
  b.title = (s.simulated ? s.bulkName + " (시뮬 노력치)"
    : s.estimated ? s.bulkName + " (추정/확정 노력치)" : s.bulkName) + " · " + txt;

}

    if (o.types && o.types.length) left.appendChild(typeIcons(o.types));
    if (!mirror && oppNameEditIdx === i) {
      // 편집: datalist 입력칸 + 비우기(✕) — 상대 기술 편집(oppRow)과 동일 패턴.
      const ew = el("div", "edit-wrap");
      const inp = el("input", "opp-name-input");
      inp.setAttribute("list", "oppSpeciesList");
      inp.value = o.name || "";
      inp.placeholder = "포켓몬 이름";
      inp.oninput = () => fetchSpeciesList(inp.value);
      inp.onkeydown = (e) => {
        if (e.key === "Enter") { e.preventDefault(); commitOppSlotName(i, inp.value); }
        else if (e.key === "Escape") { oppNameEditIdx = null; if (lastModel) render(lastModel); }
      };
      inp.onblur = () => commitOppSlotName(i, inp.value);
      ew.appendChild(inp);
      const clr = el("span", "edit-clear", "✕");
      clr.title = "입력 비우기";
      clr.onmousedown = (e) => { e.preventDefault(); inp.value = ""; inp.focus(); };  // blur 전 처리(mousedown)
      ew.appendChild(clr);
      left.appendChild(ew);
      setTimeout(() => { inp.focus(); inp.select(); fetchSpeciesList(inp.value); }, 0);
    } else {
      const nm = el("div", "slot-name" + (mirror ? "" : " editable"), o.name);
      if (!mirror) {
        nm.title = "클릭: 포켓몬 교체 (오인식 정정 — 이름 입력/선택)";
        nm.onclick = () => { oppNameEditIdx = i; if (lastModel) render(lastModel); };
      }
      left.appendChild(nm);
    }
    // 스피드: 상대 시점(mirror)=내 실제 스피드 1개(빌드 앎), 일반=상대 3단계 추정.
    if (mirror && o.mySpeed != null) { const l = el("div", "spline"); l.appendChild(mySpeedChip(o.mySpeed)); left.appendChild(l); }
    else if (o.speed) left.appendChild(speedLine(o.speed));
    c.appendChild(left);
    // 오른쪽 = 기술 4개
    const moves = el("div", "slot-moves");
    const col = renderColumn(o.column);
    if (col) moves.appendChild(col);
    c.appendChild(moves);
    wrap.appendChild(c);
  });
  if (!wrap.children.length) wrap.appendChild(el("div", "muted", "상대 파티 정보 없음"));
  return wrap;
}

// ── 매치업 ───────────────────────────────────────────────────
function muSide(name, sprite, stages, burned, paralyzed, speedEl, mirror, types, aegisToggle, aegisBlade, side, actives, sel) {
  const s = el("div", "mu-side" + (mirror ? " mirror" : ""));
  // info = sprite(위) / 타입 / 이름 / 스피드 (세로). 랭크칩은 sprite 옆 — 내=왼/상대=오른.
  const info = el("div", "mu-info");
  if (sprite) {
    // 110차 — 킬가르도(폼 전환 가능)면 sprite를 클릭 가능 래퍼로 + 원형화살표 표식. 클릭 → 폼 토글 POST.
    if (aegisToggle) {
      const wrap = el("div", "spr-wrap aegis");
      const i = el("img", "spr"); i.src = PCH_ASSET + sprite; i.alt = name; wrap.appendChild(i);
      const badge = el("div", "aegis-badge"); badge.textContent = "↺"; wrap.appendChild(badge);
      wrap.title = aegisBlade ? "클릭: 실드폼으로" : "클릭: 블레이드폼으로";
      wrap.onclick = () => sim("/api/sim/" + side + "/aegislash");
      info.appendChild(wrap);
    } else {
      const i = el("img", "spr"); i.src = PCH_ASSET + sprite; i.alt = name; info.appendChild(i);
    }
  }
  if (types && types.length) info.appendChild(typeIcons(types));
  info.appendChild(el("div", "mu-name", name || "—"));
  // 133차 — 더블: 필드 미니 sprite 2개를 이름 바로 아래 고정(스피드 위). 스피드/메가컬럼이 아래에 있어 포켓몬 교체·메가로 줄수가 변해도
  //   미니 위치는 안 밀림(사용자 지시 "미니 위치 고정"). 파란테=현재 계산 기준, 클릭=그 슬롯 기준 전환(백엔드 그 조합만 재계산).
  //   인식 전(빈 슬롯)이면 spritePath 없어 34px 빈 틀만 표시 → 더블 모드 켜짐을 즉시 확인.
  if (actives && actives.length) {
    const ar = el("div", "actives-row");
    actives.forEach((a) => {
      const cell = el("div", "active-mini" + (a.index === sel ? " sel" : ""));
      if (a.spritePath) { const img = el("img", "spr-mini"); img.src = PCH_ASSET + a.spritePath; img.alt = a.name || ""; cell.appendChild(img); }
      cell.title = a.index === sel ? (a.name || "") + " — 현재 계산 기준" : "클릭: " + (a.name || "") + " 기준으로 계산";
      if (a.index !== sel) cell.onclick = () => sim("/api/sim/double/view", { side: side, idx: a.index }); // 이미 선택된 건 클릭 무시(중복 계산 방지).
      ar.appendChild(cell);
    });
    info.appendChild(ar);
  }
  if (speedEl) info.appendChild(speedEl);
  const ranks = rankBadges(stages, burned, paralyzed);
  if (mirror) { s.appendChild(info); s.appendChild(ranks); }
  else { s.appendChild(ranks); s.appendChild(info); }
  return s;
}
function renderMatchup(m) {
  const host = el("div", "matchup-row");

  host.appendChild(muSide(m.myName, m.mySpritePath, m.myStages, m.myBurned, m.myParalyzed, renderMySpeed(m.mySpeeds), false, m.myTypes, m.myAegisToggle, m.myAegisBlade, "my", d ? d.myActives : null, d ? d.selMy : -1));
  // 중앙: 기술 리스트(위 정렬) + (더블) 광역기 토글 — 중앙 하단 고정·기본 ON(사용자 지시). 더블 모드면 인식 전에도 상존.
  const center = el("div", "mu-center" + (m.oppPerspective ? " opp-persp" : ""));

  return host;
}

// ── 파티 화이트리스트 + 시뮬 조작 ────────────────────────────
// 74차(Phase3) — 브라우저→데스크탑 시뮬 조작 POST. 모델 갱신은 WS push로 자동 반영(별도 응답처리 불요).
function sim(path, body) {
  fetch(PCH_HTTP + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) })
    .catch(() => {});
}
function renderParty(list, side) {
  const w = el("div", "party");
  (list || []).forEach((p) => {
    const c = el("div", "pmon clickable");
    if (p.isCurrent) c.classList.add("cur");
    if (p.isSimTarget) c.classList.add("sim");
    if (p.spritePath) { const img = el("img", "spr"); img.src = PCH_ASSET + p.spritePath; img.alt = p.name; c.appendChild(img); }
    if (p.types && p.types.length) c.appendChild(typeIcons(p.types));
    c.appendChild(el("div", "pname", p.name));

      if (p.isSimTarget) sim("/api/sim/" + side + "/exit");          // 노란테 재클릭 → 시뮬 종료
      else sim("/api/sim/" + side + "/start", { index: p.index });

    w.appendChild(c);
  });
  return w;
}
// [라벨] [−] [값] [+] 조정 행
function adjRow(label, valueText, onMinus, onPlus, minusLabel, plusLabel, valueColor) {

// 74차 — 상대 시뮬 지닌도구 드롭다운(헤더 클릭 펼침/접힘). 항목 클릭 → POST + 접힘.
// 147차 — 3층 규약(내 도구 시뮬 107차와 동일): null=미지정(확정/추정 도구를 그대로 따름) / "none"=도구 없음 / 그 외=지정.
//   덕분에 파란테 → 노란테(시뮬)로 켜도 도구 가정이 이어져 위력이 튀지 않는다.
//   170차(feedback) — 확정 패널과 똑같은 모양으로: 현재 적용값(시뮬 지정 > 확정 > 채용률 1위) + 채용률% 표시.
//   종전엔 미지정이면 "확정/추정 도구 따름"이라고만 떠서 그 값이 뭔지 알 수 없었다. 시뮬 지정 시 노란테.
function oppItemDropdown(m) {
  const wrap = el("div", "dropdown");
  const raw = m.oppSimItemKo;                 // 시뮬 지정값(null=미지정) — 목록 ✓ 표시용
  const eff = m.oppSimItemEffKo;              // 실제 적용값
  const isSet = !!m.oppSimItemSet;
  const pct = m.oppSimItemPct || 0;
  const choices = m.oppSimItemChoices || [];
  const label = eff == null ? "도구 정보 없음" : (eff === "none" ? "없음 (도구 없음)" : eff);
  const header = el("button", "dd-header " + (isSet ? "simset" : "est"));
  header.appendChild(el("span", "dd-label", label));
  if (!isSet && pct > 0) header.appendChild(el("span", "dd-pct", "추정 " + pct.toFixed(1) + "%"));
  header.appendChild(el("span", "dd-arrow", oppItemOpen ? "▲" : "▼"));
  header.onclick = () => { oppItemOpen = !oppItemOpen; if (lastModel) render(lastModel); };
  const ddAnchor = el("div", "dd-anchor");
  ddAnchor.appendChild(header);
  wrap.appendChild(ddAnchor);
  if (oppItemOpen) {
    const list = el("div", "dd-list");
    const addOpt = (label, itemKo, isCur, pctv) => {
      const opt = el("div", "dd-opt" + (isCur ? " sel" : ""));
      const nm = el("div", "ab-name", label + (isCur ? "  ✓" : ""));
      if (pctv > 0) nm.appendChild(el("span", "dd-pct", pctv.toFixed(1) + "%"));
      opt.appendChild(nm);
      opt.onclick = () => { oppItemOpen = false; sim("/api/sim/opp/item", { itemKo }); };
      list.appendChild(opt);
    };
    if (isSet) addOpt("시뮬 해제 (확정/추정 도구로)", "", false);
    addOpt("없음 (도구 없음)", "none", raw === "none");
    choices.forEach((c) => addOpt(c.ko, c.ko, raw === c.ko, c.pct));   // 채용률 목록(내림차순)
    // 149차 — 시점 무관 전체 목록(공격 도구 + 방어 도구). 114차의 시점별 분기(persp면 공격도구/아니면 방어도구 5종)는
    //   폐기 — 상대 도구는 시점 공유 단일 상태라 어느 탭에서 고르든 양 시점에 반영된다(OPP_ITEM_GROUPS 주석).
    OPP_ITEM_GROUPS.forEach((g) => {
      list.appendChild(el("div", "dd-grp", g.label));
      g.items.forEach((it) => { if (!choices.some((c) => c.ko === it)) addOpt(it, it, raw === it); });
    });
    ddAnchor.appendChild(list);
  }
  wrap.appendChild(el("div", "conf-note", isSet ? "시뮬 지정 — 시뮬 끄면 사라짐" : "확정/추정 도구 따름 — 고르면 시뮬"));
  return wrap;
}
// 107차 — 내 시뮬 지닌도구 드롭다운(탁쳐떨구기/트릭 대응). "시뮬 해제"=확정/빌더 도구 복귀, "없음"=도구 제거, 그 외=교체.

// 170차(feedback) — 전 특성 자동완성 목록(#abilityList) 1회 로드. 스킬스왑/트레이스로 아무 특성이나 지정할 수 있어야
//   해서 종족 보유 특성 드롭다운만으론 부족 → "직접 입력" 칸의 후보로 전 특성을 깔아둔다(≈300개, 1회 fetch 후 캐시).
let abilityListLoaded = false;
function ensureAbilityList() {
  if (abilityListLoaded) return;
  abilityListLoaded = true;
  fetch(PCH_HTTP + "/api/master/abilities")
    .then((r) => r.json())
    .then((list) => {
      const dl = $("#abilityList");
      if (!dl) return;
      dl.innerHTML = (list || []).map((a) => `<option value="${a.ko}"></option>`).join("");
    })
    .catch(() => { abilityListLoaded = false; });   // 실패 시 다음 렌더에 재시도(드롭다운 선택은 그대로 동작)
}
// 170차(feedback) — 특성 드롭다운 "직접 입력" 행. 드롭다운 후보(추정/보유 특성) 아래에 붙어 전 특성을 입력받는다.
//   Enter 또는 datalist 항목 선택(change) = 커밋. 상대 기술 편집(oppRow)과 같은 UX.
function abilityInputRow(placeholder, onCommit) {
  ensureAbilityList();
  const row = el("div", "dd-opt dd-input");
  const inp = el("input", "opp-move-input ab-input");
  inp.setAttribute("list", "abilityList");
  inp.placeholder = placeholder;
  inp.onkeydown = (e) => {
    e.stopPropagation();
    if (e.key === "Enter") { e.preventDefault(); const v = inp.value.trim(); if (v) onCommit(v); }
  };
  inp.onchange = () => { const v = inp.value.trim(); if (v) onCommit(v); };   // datalist 항목 클릭 선택
  inp.onclick = (e) => e.stopPropagation();
  row.onclick = (e) => e.stopPropagation();
  row.appendChild(inp);
  return row;
}
// 82차 — 상대 시뮬 특성 드롭다운(후보 = 그 폼 보유 특성, 각 항목 이름+효과설명). 항목 클릭 → POST /api/sim/opp/ability.

    const list = el("div", "dd-list");

    }
    choices.forEach((c) => {
      const cur = raw === c.ko;
      const opt = el("div", "dd-opt" + (cur ? " sel" : ""));
      const nm = el("div", "ab-name", c.ko + (cur ? "  ✓" : ""));

// 160차(feedback) — 드롭다운 헤더의 긴 이름이 두 줄로 접히던 문제.

//   ② 목록이 화면 아래로 넘치면 *문서 높이가 늘어나 페이지 스크롤바가 생기므로*(absolute도 문서 스크롤 영역에 포함)
//      화면 안쪽으로 잘라낸다. 아래가 너무 좁으면 위로 펼친다.

function fitDropdownLists() {
  const margin = 10;

    n.style.top = ""; n.style.bottom = "";

      n.style.maxHeight = Math.max(60, Math.floor(Math.min(want, above))) + "px";

function setStatus(txt, kind) {

  // 권한명은 크롬 버전마다 다르다 — 145+ 'loopback-network', 142~144 'local-network-access'. 모르는 이름은 throw.
  const probe = (async () => {
    for (const name of ["loopback-network", "local-network-access"]) {
      try {
        const st = await navigator.permissions.query({ name });
        if (st && st.state) { lnaStatusObj = st; return st.state; }
      } catch (_) { /* 이 브라우저가 모르는 권한명 → 다음 후보 */ }
    }
    return "unknown";
  })();
  // 조회가 늦어져도 화면이 멈추지 않게 상한. 늦으면 'unknown' = 종전 즉시연결.
  return await Promise.race([probe, new Promise((r) => setTimeout(() => r("unknown"), 500))]);
}

function showLnaGate(state) {
  const denied = state === "denied";
  $("#lna-title").textContent = denied
    ? "브라우저가 로컬 연결을 차단했습니다"
    : "헬퍼와 연결할 준비가 되었습니다";
  $("#lna-desc").innerHTML = denied
    ? "이 브라우저에서 로컬 네트워크 액세스가 차단되어 헬퍼의 실시간 데이터를 받을 수 없습니다.<br>아래 순서로 허용한 뒤 [다시 시도]를 눌러 주세요."
    : "아래 버튼을 누르면 브라우저가 <b>로컬 네트워크 액세스 허용</b> 여부를 묻습니다.<br><b>허용</b>을 눌러야 헬퍼가 계산한 위력 데이터가 표시됩니다.";
  const steps = $("#lna-steps");
  if (denied) {
    steps.style.display = "block";
    steps.innerHTML = "① 주소창 왼쪽 아이콘(🔒 또는 ⚙) 클릭 → <b>사이트 설정</b><br>"
      + "② <b>로컬 네트워크 액세스</b>를 <b>허용</b>으로 변경 (항목이 2개면 둘 다)<br>"
      + "③ 항목이 보이지 않으면 아래 주소를 주소창에 붙여넣어 설정<br>"
      + '<span class="lna-path">chrome://settings/content/localNetworkAccess</span>';
  } else {
    steps.style.display = "none";
  }
  $("#lna-btn").textContent = denied ? "다시 시도" : "헬퍼 연결하기";
  $("#lna-gate").classList.add("on");
  setStatus(denied ? "브라우저 권한 차단됨 — 허용 후 다시 시도" : "브라우저 권한 허용 필요", "warn");
  // 설정 화면에서 허용으로 바꾸면 버튼을 안 눌러도 자동 복귀.
  if (lnaStatusObj) {
    lnaStatusObj.onchange = () => {
      if (lnaStatusObj.state === "granted" && $("#lna-gate").classList.contains("on")) {
        $("#lna-gate").classList.remove("on");
        setStatus("연결 시도 중…");
        connect();
      }
    };
  }
}

$("#lna-btn").onclick = () => {
  // 사용자 제스처 + 활성 탭에서 요청 → 크롬이 프롬프트를 확실히 표시한다.
  $("#lna-gate").classList.remove("on");
  setStatus("연결 시도 중…");
  connect();
};

/// 진입점. 권한이 필요한 상태일 때만 게이트를 세우고, 그 외에는 종전처럼 즉시 연결한다.
async function startConnect() {
  let st = "unknown";
  try { st = await lnaState(); } catch (_) { st = "unknown"; }
  if (st === "prompt" || st === "denied") { showLnaGate(st); return; }
  connect();
}
// 75차 — 헬퍼 중지: WS 닫고(서버 소켓 정리 → 헬퍼 재시작 시 새 위력창 열림) 탭 닫기 시도.
//   브라우저가 직접 연 탭은 window.close()를 거부할 수 있음 → 그땐 종료 안내 화면으로 전환.
function handleShutdown() {
  shuttingDown = true;
  try { ws.close(); } catch (_) {}
  try { window.close(); } catch (_) {}
  document.body.innerHTML =
    '<div style="display:flex;height:100vh;align-items:center;justify-content:center;flex-direction:column;'
    + 'gap:12px;color:#9aa0a8;font-family:Malgun Gothic,sans-serif;text-align:center;">'
    + '<div style="font-size:44px;">⏹</div>'
    + '<div style="font-size:16px;color:#e8eaed;">헬퍼(오버레이)가 종료되었습니다.</div>'
    + '<div style="font-size:13px;">이 탭은 닫아도 됩니다. 헬퍼를 다시 시작하면 새 위력창이 열립니다.</div></div>';
}
// 113차 — "실제 수치" 토글(% ↔ 실 데미지). 로컬 상태라 서버 왕복 없이 재렌더만. 내/상대 위력칩 공통 적용.
$("#real-toggle").onclick = () => {
  showRealDamage = !showRealDamage;
  $("#real-toggle").classList.toggle("on", showRealDamage);
  if (lastModel) render(lastModel);
};
// 120차 — "선출 정보" 모달. 계산 요청은 ①열기 ②"다시 계산" ③모달 열림 중 상대 파티 변경(render의 sig 감지) —
//   각 1회 POST(폴링 없음). 헬퍼가 요청당 1회 계산해 JSON 반환.
let pickOpen = false;
let pickOppSig = null; // 모달 열림 중 상대 파티 변경 감지용(WS push마다 문자열 비교만)
function pickSig(m) { return ((m && m.oppParty) || []).map((p) => p.name).join(","); }
function togglePickModal() {
  pickOpen = !pickOpen;
  $("#pick-modal").style.display = pickOpen ? "flex" : "none";
  $("#pick-toggle").classList.toggle("on", pickOpen);
  if (pickOpen) { pickOppSig = pickSig(lastModel); fetchPickInfo(); }
}
async function fetchPickInfo() {
  $("#pick-status").textContent = "계산 중…";
  try {
    const r = await fetch(PCH_HTTP + "/api/sim/pick-info",
      { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    const j = await r.json();
    renderPickInfo(j.ok ? j.info : null, false);
  } catch { renderPickInfo(null, true); }
}
// 121차 — UI 재설계: ①추천 트리오 카드 ②팀 경고 배지 ③6×6 히트맵 그리드(셀=듀얼 판정 채색, 클릭=상세).
//   채색 규칙(120차 사용자 지시 유지): 유리=빨강 / 불리=파랑 / 반반=회색.
let lastPickInfo = null;
let pickSel = null; // 선택 셀 {mi, oj}
const PICK_BADGE_GLYPH = { recovery: "♻", offsetup: "⬆", defsetup: "🛡", burn: "🔥", paralysis: "⚡", sleep: "💤", toxic: "☠", priority: "▶" };
const PICK_SPD_GLYPH = ["▼", "▽", "△", "▲"]; // speedTier 0(열세)~3(최속에도 우위)
const pickTurnsTxt = (t) => (t >= 6 ? "6타+" : t + "타");
function pickSegCls(e) {
  // 세그먼트 채색: 내 타수 1~2=good·4+/유효타없음=bad·3=중립 / 상대는 반대 / 스피드 우위=good.
  const myCls = e.myBestPct > 0 && e.myTurns <= 2 ? "pick-good"
    : (e.myBestPct <= 0 || e.myTurns >= 4) ? "pick-bad" : null;
  const oppCls = e.oppMovesUnknown ? null
    : (e.oppBestPct <= 0 || e.oppTurns >= 4) ? "pick-good"
    : e.oppTurns <= 2 ? "pick-bad" : null;
  const spdCls = (e.speedText || "").startsWith("스피드 우위") ? "pick-good" : "pick-bad";
  return { myCls, oppCls, spdCls };
}
function renderPickInfo(info, offline) {
  const body = $("#pick-body");
  body.innerHTML = "";
  lastPickInfo = info;
  pickSel = null;
  $("#pick-status").textContent = info ? "계산 시각 " + new Date().toLocaleTimeString() : "";
  if (!info) {
    body.appendChild(el("div", "pick-wait", offline
      ? "헬퍼에 연결할 수 없습니다. 헬퍼가 실행 중인지(또는 최신 버전인지) 확인하세요."
      : "상대 파티 인식 대기 중 — 매치 시작(엔트리 선택 화면)에서 상대 6마리가 인식되면 자동으로 표시됩니다."));
    return;
  }
  const members = info.members || [];
  const reco = info.recommendation;

  // ① 추천 트리오 카드(내 파티 3마리 이상일 때만 서버가 채움).
  if (reco && reco.trios && reco.trios.length) {
    body.appendChild(el("div", "pick-sec-title", "추천 선출 (참고용)"));
    const row = el("div", "pick-reco-row");
    reco.trios.forEach((t, ti) => {
      const card = el("div", "pick-reco" + (ti === 0 ? " best" : ""));
      card.appendChild(el("div", "pick-reco-rank", (ti + 1) + "순위"));
      const mons = el("div", "pick-reco-mons");
      (t.memberIdx || []).forEach((mi) => {
        const m = members[mi];
        if (!m) return;
        const box = el("div", "pick-reco-mon");
        if (m.spritePath) { const i = el("img"); i.src = PCH_ASSET + m.spritePath; i.alt = m.nameKo; box.appendChild(i); }
        box.appendChild(el("div", "nm", m.nameKo));
        // 142차(더블) — 더블 = 4마리 추천 + 리드 페어(leadIdx/lead2Idx) "★ 리드" 2개. 싱글 = 선봉 1개(기존).
        if (mi === t.leadIdx || (t.lead2Idx >= 0 && mi === t.lead2Idx))
          box.appendChild(el("div", "pick-lead-badge", info.doubles ? "★ 리드" : "★ 선봉"));
        mons.appendChild(box);
      });
      card.appendChild(mons);
      const rs = el("div", "pick-reco-reasons");
      (t.reasons || []).forEach((r) => rs.appendChild(el("div", null, "· " + r)));
      card.appendChild(rs);
      row.appendChild(card);
    });
    body.appendChild(row);
  }

  // ② 팀 경고 배지(순풍/트릭룸/장판/벽 요원).
  if (reco && reco.teamWarnings && reco.teamWarnings.length) {
    const wr = el("div", "pick-warn-row");
    reco.teamWarnings.forEach((w) => wr.appendChild(el("span", "pick-warn", "⚠ " + w)));
    body.appendChild(wr);
  }

  // ③ 6×6 히트맵 그리드.
  if (!members.length) return;
  body.appendChild(el("div", "pick-legend",
    "행=내 파티 · 열=상대 — 셀 배경: 빨강=유리 / 파랑=불리 / 회색=반반 · 셀 클릭=상세 · 우상단 화살표=스피드(▲최속에도 우위 △풀보정까지 ▽무보정만 ▼열세)"));
  const wrap = el("div", "pick-grid-wrap");
  const table = document.createElement("table");
  table.className = "pick-grid";
  const trh = document.createElement("tr");
  trh.appendChild(el("th", null, "내 ↓ 상대 →"));
  (members[0].entries || []).forEach((e, oj) => {
    const th = document.createElement("th");
    if (e.oppSpritePath) { const i = el("img"); i.src = PCH_ASSET + e.oppSpritePath; i.alt = e.oppNameKo; th.appendChild(i); }
    th.appendChild(el("div", null, e.oppNameKo));
    const tags = info.oppTags && info.oppTags[oj];
    if (tags && tags.badges && tags.badges.length) {
      const b = el("div", "pick-badges", tags.badges.map((x) => PICK_BADGE_GLYPH[x.kind] || "•").join(""));
      b.title = tags.badges.map((x) => x.text).join("\n");
      th.appendChild(b);
    }
    trh.appendChild(th);
  });
  table.appendChild(trh);
  members.forEach((m, mi) => {
    const tr = document.createElement("tr");
    const me = document.createElement("td");
    me.className = "me";
    if (m.spritePath) { const i = el("img"); i.src = PCH_ASSET + m.spritePath; i.alt = m.nameKo; me.appendChild(i); }
    me.appendChild(el("span", null, m.nameKo));
    me.appendChild(el("div", "pick-me-sub", "스피드 " + m.mySpeed + (m.megaAssumed ? " · 메가 기준" : "")));
    tr.appendChild(me);
    (m.entries || []).forEach((e, oj) => {
      const td = document.createElement("td");
      const v = e.duel ? e.duel.verdict : "반반";
      td.className = "pick-cell " + (v === "유리" ? "pick-c-good" : v === "불리" ? "pick-c-bad" : "pick-c-mid");
      const c = pickSegCls(e);
      td.appendChild(el("div", c.myCls, e.myBestPct > 0 ? "내 " + pickTurnsTxt(e.myTurns) : "유효타 ✕"));
      td.appendChild(el("div", c.oppCls, e.oppMovesUnknown ? "상대 ?" : e.oppBestPct > 0 ? "상대 " + pickTurnsTxt(e.oppTurns) : "상대 ✕"));
      const spd = el("span", "spd", PICK_SPD_GLYPH[e.speedTier || 0]);
      td.appendChild(spd);
      td.title = m.nameKo + " vs " + e.oppNameKo + "\n" + e.myText + "\n" + e.oppText + "\n" + e.speedText
        + (e.duel && e.duel.reasons && e.duel.reasons.length ? "\n" + e.duel.reasons.map((r) => "· " + r).join("\n") : "");
      td.onclick = () => selectPickCell(mi, oj, td);
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
  wrap.appendChild(table);
  body.appendChild(wrap);

  const det = el("div", "pick-detail");
  det.id = "pick-detail";
  body.appendChild(det);
  body.appendChild(el("div", "pick-caveat",
    (info.caveatText || "") + (reco && reco.caveatText ? " " + reco.caveatText : "")));
}
// 121차 — 셀 클릭 → 그리드 아래 상세(기술명·%·스피드 문장·듀얼 근거). 같은 셀 재클릭=닫기.
function selectPickCell(mi, oj, td) {
  document.querySelectorAll(".pick-cell.sel").forEach((x) => x.classList.remove("sel"));
  const det = $("#pick-detail");
  if (!det || !lastPickInfo) return;
  if (pickSel && pickSel.mi === mi && pickSel.oj === oj) { pickSel = null; det.style.display = "none"; return; }
  pickSel = { mi: mi, oj: oj };
  td.classList.add("sel");
  const m = lastPickInfo.members[mi], e = m.entries[oj];
  det.innerHTML = "";
  const hd = el("div", null);
  hd.style.fontWeight = "700";
  hd.appendChild(el("span", null, m.nameKo + " vs " + e.oppNameKo + " — "));
  const v = e.duel ? e.duel.verdict : "반반";
  hd.appendChild(el("span", v === "유리" ? "pick-good" : v === "불리" ? "pick-bad" : null, v));
  det.appendChild(hd);
  const c = pickSegCls(e);
  const ln = el("div", null);
  ln.appendChild(el("span", c.myCls, e.myText));
  ln.appendChild(el("span", null, " · "));
  ln.appendChild(el("span", c.oppCls, e.oppText));
  ln.appendChild(el("span", null, " · "));
  ln.appendChild(el("span", c.spdCls, e.speedText));
  det.appendChild(ln);
  ((e.duel && e.duel.reasons) || []).forEach((r) => det.appendChild(el("div", "pick-reason", "· " + r)));
  det.style.display = "block";
}
// 174차 — 배틀 상태 초기화. 배틀 종료 멘트("승부에서 …")를 OCR이 놓치면 배틀 진행 상태가 고착돼
//   다음 판 엔트리 화면을 인식하지 못한다. 그때 누르면 오버레이 재시작 없이 풀린다(전적은 올라가지 않음).
$("#battle-reset").onclick = () => {
  sim("/api/sim/battle/reset");
  setStatus("배틀 상태 초기화 — 다음 엔트리 화면에서 상대 파티를 다시 인식합니다", "warn");
};
$("#pick-toggle").onclick = togglePickModal;
$("#pick-close").onclick = togglePickModal;
$("#pick-refresh").onclick = fetchPickInfo;
$("#pick-modal").onclick = (e) => { if (e.target === $("#pick-modal")) togglePickModal(); };
startConnect();   // 160차 — 권한 상태 확인 후 연결(granted/미지원/로컬 서빙이면 즉시 connect = 종전과 동일)
</script>
</body>
</html>
